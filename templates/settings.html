<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FamilyGame | الإعدادات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container animate-in">
        <h2 class="logo"><i class="fas fa-user-cog"></i> الإعدادات</h2>

        <div class="settings-list" style="margin-top: 20px;">

            <div style="margin: 15px auto; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border-radius: 50%; border: 3px solid #a29bfe;">
                <i class="fas fa-user-circle" style="font-size: 4rem; color: #a29bfe;"></i>
            </div>

            <h4 style="color: #a29bfe; margin-bottom: 15px;"><i class="fas fa-key"></i> تحديث كلمة المرور</h4>

            {% if error %}
            <div style="background: rgba(255, 118, 117, 0.2); color: #ff7675; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ff7675; text-align: center;">
                {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div style="background: rgba(85, 239, 196, 0.2); color: #55efc4; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #55efc4; text-align: center;">
                {{ success }}
            </div>
            {% endif %}

            <form action="/change_password" method="POST" class="auth-form" style="padding: 0;">
                <div class="input-group" style="position: relative; margin-bottom: 10px;">
                    <input type="password" id="new_password" name="new_password" placeholder="كلمة المرور الجديدة" required 
                           style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; width: 100%; padding: 12px; border-radius: 10px; padding-left: 45px; box-sizing: border-box;">
                    <i class="fas fa-eye-slash toggle-password" id="toggleNewPassword" 
                       style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255,255,255,0.5);"></i>
                </div>

                <div class="input-group" style="position: relative; margin-bottom: 15px;">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="تأكيد كلمة المرور" required 
                           style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; width: 100%; padding: 12px; border-radius: 10px; padding-left: 45px; box-sizing: border-box;">
                    <i class="fas fa-eye-slash toggle-password" id="toggleConfirmPassword" 
                       style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255,255,255,0.5);"></i>
                </div>

                <button type="submit" class="btn btn-secondary" style="width: 100%; font-size: 0.9rem; padding: 12px; background: #6c5ce7; border: none; color: white; border-radius: 10px; cursor: pointer;">تحديث كلمة المرور</button>
            </form>

            <hr style="opacity: 0.1; margin: 25px 0;">

            <a href="/logout" style="text-decoration: none; display: block; margin-bottom: 15px;">
                <div class="stat-card" style="border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; background: rgba(255,255,255,0.02); transition: 0.3s;">
                    <p style="margin: 0; display: flex; justify-content: space-between; align-items: center; color: white;">
                        <span>تسجيل الخروج</span>
                        <i class="fas fa-sign-out-alt"></i>
                    </p>
                </div>
            </a>

            <a href="javascript:void(0)" onclick="confirmDelete()" style="text-decoration: none; display: block; margin-bottom: 25px;">
                <div class="stat-card" style="border: 1px solid #ff7675; background: rgba(255, 118, 117, 0.1); padding: 15px; border-radius: 10px; transition: 0.3s;">
                    <p style="color: #ff7675; margin: 0; display: flex; justify-content: space-between; align-items: center;">
                        <span>حذف الحساب نهائياً</span>
                        <i class="fas fa-trash-alt"></i>
                    </p>
                </div>
            </a>

            <div style="text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                <a href="/dashboard" class="back-link" style="color: #a29bfe; text-decoration: none; border: 1px solid #a29bfe; padding: 10px 25px; border-radius: 10px; display: inline-block; transition: 0.3s;">
                    العودة للرئيسية <i class="fas fa-arrow-left"></i>
                </a>
            </div>
        </div>
    </div>

    <script>
    // دالة تأكيد حذف الحساب
    function confirmDelete() {
        if (confirm("هل أنت متأكد من حذف حسابك نهائياً؟ لا يمكن التراجع عن هذا الإجراء!")) {
            window.location.href = "/delete_account";
        }
    }

    // دالة إظهار وإخفاء كلمة المرور
    function setupPasswordToggle(toggleId, inputId) {
        const toggle = document.querySelector(toggleId);
        const input = document.querySelector(inputId);

        toggle.addEventListener('click', function () {
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    }

    setupPasswordToggle('#toggleNewPassword', '#new_password');
    setupPasswordToggle('#toggleConfirmPassword', '#confirm_password');
    </script>
</body>
</html>
