<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FamilyGame | التحدي بدأ!</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-color: #55efc4; --bg-dark: #0f0f1b; }
        body { background: var(--bg-dark); color: white; font-family: 'Cairo', sans-serif; margin: 0; overflow-x: hidden; }

        /* تصميم التايمر والحرف */
        .game-header { display: flex; justify-content: space-around; align-items: center; padding: 20px; background: rgba(255,255,255,0.05); border-bottom: 2px solid var(--neon-color); }
        .timer-box { font-size: 2rem; color: #ff7675; font-weight: 900; }
        .letter-box { font-size: 4rem; color: var(--neon-color); text-shadow: 0 0 20px var(--neon-color); }

        .game-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }

        /* خانات اللعبة */
        .inputs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid #34495e; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #a29bfe; }
        .input-group input { width: 100%; background: none; border: none; border-bottom: 2px solid #555; color: white; font-size: 1.2rem; outline: none; padding: 5px; }
        .input-group input:focus { border-bottom-color: var(--neon-color); }
        .input-group input:disabled { color: #636e72; border-bottom-color: #2d3436; cursor: not-allowed; }

        /* الشات الجماعي */
        .chat-box { background: #1e1e2e; border-radius: 15px; display: flex; flex-direction: column; height: 500px; border: 1px solid #34495e; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 15px; font-size: 0.9rem; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #34495e; }
        .chat-input-area input { flex: 1; background: #2d3436; border: none; color: white; padding: 8px; border-radius: 5px; outline: none; }

        .stop-btn { grid-column: span 2; padding: 20px; background: var(--neon-color); color: #000; border: none; border-radius: 12px; font-size: 1.5rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .stop-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--neon-color); }
    </style>
</head>
<body>

    <div class="game-header">
        <div class="timer-box">الوقت: <span id="timer-display">{{ timer }}</span></div>
        <div class="letter-box">الحرف: {{ letter }}</div>
        <div class="score-box">لاعب: {{ user.username }}</div>
    </div>

    <div class="game-container">
        <div class="inputs-area">
            <div class="inputs-grid" id="game-fields">
                <div class="input-group"><label>اسم ولد</label><input type="text" class="game-input" id="val-1" onpaste="return false;"></div>
                <div class="input-group"><label>اسم بنت</label><input type="text" class="game-input" id="val-2" onpaste="return false;"></div>
                <div class="input-group"><label>حيوان</label><input type="text" class="game-input" id="val-3" onpaste="return false;"></div>
                <div class="input-group"><label>نبات</label><input type="text" class="game-input" id="val-4" onpaste="return false;"></div>
                <div class="input-group"><label>بلاد</label><input type="text" class="game-input" id="val-5" onpaste="return false;"></div>
                <div class="input-group"><label>جماد / ممثل</label><input type="text" class="game-input" id="val-6" onpaste="return false;"></div>
                <button class="stop-btn" onclick="finishGame()">تم / إيقاف اللعبة!</button>
            </div>
        </div>

        <div class="chat-box">
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chat-msg" placeholder="اكتب لزمايلك...">
                <button onclick="sendChat()" style="background:var(--neon-color); border:none; margin-right:5px; border-radius:5px; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const lobbyId = "{{ lobby_id }}";
        const urlParams = new URLSearchParams(window.location.search);

        // 1. قراءة الحرف والوقت من الرابط أو من السيرفر
        const gameLetter = urlParams.get('letter') || "{{ letter }}" || "أ";
        let timeLeft = parseInt(urlParams.get('timer')) || parseInt(urlParams.get('time')) || parseInt("{{ timer }}") || 60;

        // 2. تعريف المتغيرات (مرة واحدة فقط)
        let timerId; 
        const timerDisplay = document.getElementById('timer-display'); // السطر ده كان ناقص عندك

        // 3. تحديث الواجهة فوراً
        if (document.querySelector('.letter-box')) {
            document.querySelector('.letter-box').innerText = "الحرف: " + gameLetter;
        }
        if (timerDisplay) {
            timerDisplay.innerText = timeLeft;
        }

        socket.on('connect', () => {
            socket.emit('join_lobby', { room: lobbyId });
        });

        // 4. دالة تشغيل التايمر
        function startTimer() {
            // لو فيه تايمر شغال قديم بنمسحه عشان ما يحصلش تداخل
            if (timerId) clearInterval(timerId);

            timerId = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    finishGame(); 
                } else {
                    timeLeft--;
                    if (timerDisplay) timerDisplay.innerText = timeLeft;
                }
            }, 1000);
        }

        // تشغيل التايمر أول ما الصفحة تحمل
        window.onload = startTimer;

        function finishGame() {
            clearInterval(timerId); 
            const inputs = document.querySelectorAll('.game-input');
            let answers = [];
            inputs.forEach(input => {
                input.disabled = true;
                answers.push(input.value);
            });

            socket.emit('player_finished', { 
                lobby_id: lobbyId, 
                username: "{{ user.username }}", 
                answers: answers,
                letter: gameLetter 
            });
        }

        socket.on('stop_game_for_all', (data) => {
            alert("اللعبة توقفت! " + data.winner + " خلص الأول.");
            clearInterval(timerId);
            document.querySelectorAll('.game-input').forEach(i => i.disabled = true);
        });

        // --- كود الشات و النتائج يكمل هنا زي ما هو عندك ---
        function sendChat() {
            const msg = document.getElementById('chat-msg').value;
            if(msg) {
                socket.emit('game_chat', { room: lobbyId, user: "{{ user.username }}", message: msg });
                document.getElementById('chat-msg').value = '';
            }
        }

        socket.on('receive_game_chat', (data) => {
            const div = document.createElement('div');
            div.innerHTML = `<b>${data.user}:</b> ${data.message}`;
            document.getElementById('chat-messages').appendChild(div);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        });

        socket.on('show_results', (data) => {
                let rows = "";
                data.leaderboard.forEach((player, index) => {
                    let medal = index === 0 ? "🥇" : (index === 1 ? "🥈" : (index === 2 ? "🥉" : ""));
                    rows += `
                        <div style="display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid ${index === 0 ? '#f1c40f' : '#34495e'}">
                            <span>${medal} المركز ${index + 1} - ${player[0]}</span>
                            <span style="color: #55efc4; font-weight: bold;">${player[1]} نقطة</span>
                        </div>`;
                });

                const statsHTML = `
                    <div id="stats-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f0f1b; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; direction: rtl;">
                        <h1 style="color: #f1c40f; margin-bottom: 30px;">إحصائيات الجيم 📊</h1>
                        <div style="width: 100%; max-width: 500px; background: #1e1e2e; padding: 20px; border-radius: 20px; border: 2px solid #55efc4;">
                            ${rows}
                        </div>
                        <p style="margin-top: 20px;">سيتم العودة للرئيسية خلال <span id="back-timer" style="color:#ff7675; font-weight:bold;">10</span> ثوانٍ...</p>
                        <button onclick="window.location.href='/dashboard'" style="margin-top: 10px; padding: 12px 30px; background: #6c5ce7; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">العودة الآن</button>
                    </div>
                `;

                document.body.insertAdjacentHTML('beforeend', statsHTML);

                let backTime = 10;
                let backInterval = setInterval(() => {
                    backTime--;
                    const timerEl = document.getElementById('back-timer');
                    if(timerEl) timerEl.innerText = backTime;

                    if (backTime <= 0) {
                        clearInterval(backInterval);
                        window.location.href = '/dashboard';
                    }
                }, 1000);
            });

            // 3. باقي الـ Listeners مثل الشات وغيره...
        </script>
</body>
</html>
